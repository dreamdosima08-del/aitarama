<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#020807"/>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F28A"/>
      <stop offset="100%" stop-color="#00b8d9"/>
    </linearGradient>
    <filter id="gl" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Dış halka — tarama efekti -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#g)"
    stroke-width="3.5" stroke-linecap="round"
    stroke-dasharray="120 42" transform="rotate(-45 32 32)"/>
  <!-- İç sinyal dalgası -->
  <path d="M18 32 Q22 18 26 32 Q30 46 34 32 Q38 18 42 32 Q46 46 48 32"
    fill="none" stroke="#00b8d9" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M20 32 Q26 14 32 32 Q38 50 44 32"
    fill="none" stroke="url(#g)" stroke-width="2.8" stroke-linecap="round" filter="url(#gl)"/>
  <!-- Merkez parlayan nokta -->
  <circle cx="32" cy="32" r="5" fill="#00F28A" filter="url(#gl)"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" opacity="0.9"/>
</svg>
